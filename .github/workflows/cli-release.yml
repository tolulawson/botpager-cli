name: Release CLI

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable version already committed in package.json (for example 0.1.0)'
        required: true
        type: string

concurrency:
  group: cli-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  binaries:
    uses: ./.github/workflows/binaries.yml
  release:
    needs: binaries
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm-production
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - run: bun install --frozen-lockfile
      - name: Validate release identity
        id: release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: bun scripts/check-release.ts "$RELEASE_VERSION"
      - run: bun run typecheck
      - run: bun run test
      - uses: actions/download-artifact@v4
        with:
          pattern: standalone-*
          path: standalone
      - name: Collect standalone archives
        run: |
          mkdir -p artifacts
          find standalone -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} artifacts/ \;
      - name: Check production API
        run: |
          curl --fail --silent --show-error --max-time 20 https://botpager-api.reostack.com/healthz > health.json
          node -e 'if (JSON.parse(require("fs").readFileSync("health.json")).ok !== true) process.exit(1)'
      - name: Pack and install the release artifact
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts
          npm pack . --pack-destination artifacts
          bun scripts/restore-staged.ts
          bash scripts/smoke-cli-package.sh "$PWD/artifacts/reostack-botpager-$RELEASE_VERSION.tgz"
          cd artifacts
          sha256sum ./*.tgz > SHA256SUMS
      - name: Production E2E with installed npm artifact and Linux binary
        run: |
          npm install --prefix /tmp/botpager-e2e --ignore-scripts artifacts/*.tgz
          node scripts/e2e-api.mjs /tmp/botpager-e2e/node_modules/.bin/botpager https://botpager-api.reostack.com artifacts/e2e-npm.json
          mkdir -p /tmp/botpager-native
          tar -xzf artifacts/botpager-*-linux-x64.tar.gz -C /tmp/botpager-native
          node scripts/e2e-api.mjs /tmp/botpager-native/botpager https://botpager-api.reostack.com artifacts/e2e-native.json
      - name: Stage immutable GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/stage-release.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: botpager-cli-${{ steps.release.outputs.version }}
          path: artifacts/
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      # Configure npm trusted publishing for this exact filename and environment.
      - name: Publish through npm OIDC and verify registry integrity
        run: bun scripts/publish-cli.ts
      - name: Publish completed GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
      - name: Verify public binary installer and npm install
        run: |
          BOTPAGER_VERSION=${{ inputs.version }} BOTPAGER_INSTALL_DIR=/tmp/botpager-public bash install.sh
          /tmp/botpager-public/botpager --version
          npm install --prefix /tmp/botpager-public-npm --ignore-scripts @reostack/botpager@${{ inputs.version }}
          test "$(/tmp/botpager-public-npm/node_modules/.bin/botpager --version)" = '${{ inputs.version }}'
