name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    name: CLI (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '24']
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Verify distributable
        run: |
          mkdir -p artifacts
          npm pack . --pack-destination artifacts
          bash scripts/smoke-cli-package.sh "$PWD/$(find artifacts -name '*.tgz' -print -quit)"
          bash -n install.sh
      - name: Verify release gates with installed package
        run: |
          npm install --prefix /tmp/botpager-gate-cli --ignore-scripts "$PWD"/artifacts/*.tgz
          node scripts/test-release-gates.mjs /tmp/botpager-gate-cli/node_modules/.bin/botpager
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-gates-node-${{ matrix.node }}
          path: artifacts/release-gate-regressions.json
