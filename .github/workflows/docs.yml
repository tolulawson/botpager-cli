name: CLI docs
on:
  pull_request:
    paths: ['docs/site/**', '.github/workflows/docs.yml']
  push:
    branches: [main]
    paths: ['docs/site/**', '.github/workflows/docs.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/site
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: docs/site/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: python3 scripts/check-export.py
      - run: node scripts/prepare-deployment.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: cli-docs-static
          path: docs/site/out
